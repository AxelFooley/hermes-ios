name: Hermes
options:
  bundleIdPrefix: ai.hermes.ios
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  xcodeVersion: "15.4"
  objectVersion: 60

packages:
  HermesKit:
    path: HermesKit

targets:
  Hermes:
    type: application
    platform: iOS
    sources:
      - App
    dependencies:
      - package: HermesKit
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Hermes
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        SWIFT_VERSION: "5.10"
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""

schemes:
  Hermes:
    build:
      targets:
        Hermes: all
    run:
      config: Debug
